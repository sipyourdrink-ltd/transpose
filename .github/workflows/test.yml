name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd menubar && ./build.sh
